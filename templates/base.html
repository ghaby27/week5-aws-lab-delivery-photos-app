<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Delivery photos{% endblock %} · Onward Logistics</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1b2228; }
    header { background: #1f3864; color: #fff; padding: .9rem 1.5rem; display: flex; flex-wrap: wrap;
             align-items: center; justify-content: space-between; gap: .5rem; }
    header h1 { margin: 0; font-size: 1.15rem; }
    nav a { color: #fff; margin-left: 1rem; text-decoration: none; opacity: .9; }
    nav a:hover { opacity: 1; text-decoration: underline; }
    main { max-width: 70rem; margin: 1.5rem auto; padding: 0 1rem; }
    section { background: #fff; border: 1px solid #d5dbe1; border-radius: 6px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    h2 { margin: 0 0 .75rem; font-size: 1.05rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1rem; }
    .card { background: #fff; border: 1px solid #d5dbe1; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
    .card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #e3e7eb; }
    .card .body { padding: .75rem; display: grid; gap: .3rem; font-size: .9rem; flex: 1; }
    .card h3 { margin: 0; font-size: 1rem; }
    .meta { color: #5d6973; font-size: .8rem; }
    .card form { padding: 0 .75rem .75rem; }
    label { display: grid; gap: .25rem; font-size: .9rem; }
    input, textarea { padding: .45rem; border: 1px solid #b8c1ca; border-radius: 4px; font: inherit; }
    .form { display: grid; gap: .75rem; max-width: 36rem; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    button { padding: .45rem 1rem; border: 0; border-radius: 4px; background: #1f3864; color: #fff; cursor: pointer; font: inherit; }
    button.secondary { background: #fff; color: #b00020; border: 1px solid #b00020; }
    .notice { background: #e6f4ea; border-color: #9bd3ae; }
    .error { color: #b00020; }
    .note { color: #5d6973; font-size: .85rem; }
    footer { max-width: 70rem; margin: 0 auto 2rem; padding: 0 1rem; color: #5d6973; font-size: .8rem; }
    @media (max-width: 30rem) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Onward Logistics · Delivery photos</h1>
    <nav>
      <a href="{{ url_for('gallery') }}">Gallery</a>
      <a href="{{ url_for('upload_form') }}">Upload</a>
      <a href="{{ url_for('deleted') }}">Recently deleted</a>
      <a href="{{ url_for('about') }}">About</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Served by task {{ server.task }} in {{ server.zone }} · version {{ server.version }}</footer>
</body>
</html>
